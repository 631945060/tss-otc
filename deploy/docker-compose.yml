services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tss_wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: wallet
      MYSQL_ROOT_PASSWORD: root-password-change-me
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-password-change-me"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  wallet-api:
    build: ..
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      STATIC_DIR: /web
      MYSQL_DSN: "wallet:wallet@tcp(mysql:3306)/tss_wallet?charset=utf8mb4&parseTime=true&loc=UTC"
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  wallet-consumers:
    build: ..
    command: ["startConsumers"]
    environment:
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
