<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSS Wallet Console</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#overview"><span class="brand-mark">T</span><span>TSS Wallet</span></a>
        <p class="workspace">OPERATIONS CONSOLE</p>
        <nav class="nav" aria-label="Primary navigation">
          <a href="#overview" data-page="overview">Overview</a>
          <a href="#nodes" data-page="nodes">Node management</a>
          <a href="#sessions" data-page="sessions">Signing sessions</a>
          <a href="#transactions" data-page="transactions">Transactions</a>
          <a href="#audit" data-page="audit">Audit log</a>
        </nav>
        <div class="sidebar-foot"><span class="pulse"></span> 2-of-3 policy active</div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div><p class="eyebrow" id="breadcrumb">WALLET OPERATIONS</p><h1 id="page-title">Overview</h1></div>
          <div class="topbar-actions"><span class="api-state" id="api-state">Checking API</span><button class="button secondary" id="refresh-button" type="button">Refresh</button></div>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
